publish_to: 'none' #
version: 1.0.0+3

environment:
  sdk: ^3.9.2

dependencies:
  crypto: ^3.0.6
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: 1.1.6

  get: ^4.7.3
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  connectivity_plus: ^7.1.1
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2
  path_provider: ^2.1.5
  url_strategy: ^0.3.0
  image_picker: ^1.2.2
  cached_network_image: ^3.4.1
  google_maps_flutter: ^2.17.0
  geolocator: ^14.0.2
  url_launcher: ^6.3.2
  country_code_picker: ^3.4.1
  phone_numbers_parser: ^9.0.22
  pin_code_fields: ^9.4.0
  flutter_widget_from_html_core: ^0.17.2
  flutter_typeahead: ^6.0.0
  pointer_interceptor: ^0.10.1+2
  shimmer_animation: ^2.2.2+1
  carousel_slider: ^5.1.2
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.1.6
  smooth_page_indicator: ^2.0.1
  file_picker: ^11.0.2
  flutter_local_notifications: ^21.0.0
  universal_html: ^2.3.0
  flutter_inappwebview: ^6.1.5
  timeago: ^3.7.1
  pdf: ^3.12.0
  flutter_downloader: ^1.12.0
  permission_handler: ^12.0.1
  fluttertoast: ^9.1.0
  audioplayers: ^6.6.0
  dotted_border: ^3.1.0
  expandable_bottom_sheet: ^1.1.1+1
  share_plus: ^12.0.1
  rect_getter: ^1.1.0
  scroll_to_index: ^3.0.1
  http_parser: ^4.1.2
  http: ^1.6.0
  path: ^1.9.1
  syncfusion_flutter_datepicker: ^33.2.7
  sign_in_with_apple: ^8.0.0
  uuid: ^4.5.3
  just_the_tooltip: ^0.0.12
  custom_marker: ^1.0.0
  photo_view: ^0.15.0
  flutter_slidable: ^4.0.3
  app_links: ^7.0.0
  flutter_xlider: ^3.5.0
  video_player: ^2.11.1
  chewie: ^1.13.0
  firebase_auth: ^6.5.1
  readmore: ^3.0.0
  lottie: ^3.3.3
  drift: ^2.33.0
  drift_flutter: ^0.3.0
  skeletonizer: ^2.1.3
  app_tracking_transparency: ^2.0.6+1
  firebase_analytics: ^12.4.1
  facebook_app_events: ^0.27.2
  tiktok_events_sdk: ^1.3.0
  dotted_line: ^3.2.3




dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.30.0
  build_runner: ^2.10.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/brand/
    - assets/icons/solar/
    - assets/icons/currency/
    - assets/language/
    - assets/json/
    - assets/map/
    - assets/notification.wav

  fonts:
    - family: Norsal
      fonts:
        - asset: assets/font/Norsal-ExtraLight.otf
          weight: 200
        - asset: assets/font/Norsal-Regular.otf
          weight: 400
        - asset: assets/font/Norsal-SemiBold.otf
          weight: 600
        - asset: assets/font/Norsal-Bold.otf
          weight: 700
    - family: SaudiRiyal
      fonts:
        - asset: assets/font/SaudiRiyal-Regular.otf
    - family: Roboto
      fonts:
        - asset: assets/font/Roboto-Light.ttf
          weight: 300
        - asset: assets/font/Roboto-Regular.ttf
          weight: 400
        - asset: assets/font/Roboto-Medium.ttf
          weight: 500
        - asset: assets/font/Roboto-Bold.ttf
          weight: 700
