name: demandium_serviceman
description: NIRAB CLEAN — الفني

publish_to: 'none' #

version: 1.0.0+7

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  flutter_svg: 2.2.4
  flutter_localizations:
    sdk: flutter
  get: ^4.7.3
  intl: ^0.20.2
  http: ^1.6.0
  http_parser: ^4.1.2
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  connectivity_plus: ^7.1.1
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2
  image_picker: ^1.2.2
  cached_network_image: ^3.4.1
  geolocator: ^14.0.2
  url_launcher: ^6.3.2
  country_code_picker: ^3.4.1
  pin_code_fields: ^9.4.0
  flutter_widget_from_html_core: ^0.17.2
  shimmer_animation: ^2.2.2+1
  fl_chart: ^1.2.0
  dotted_border: ^3.1.0
  flutter_local_notifications: ^21.0.0
  file_picker: ^11.0.2
  pdf: ^3.12.0
  open_file: ^3.5.11
  flutter_downloader: ^1.12.0
  permission_handler: ^12.0.1
  printing: ^5.14.3
  flutter_switch: ^0.3.2
  photo_view: ^0.15.0
  scroll_to_index: ^3.0.1
  phone_numbers_parser: ^9.0.22
  firebase_auth: ^6.5.1
  skeletonizer: ^2.1.3



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0



flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/brand/
    - assets/icons/solar/
    - assets/icons/currency/
    - assets/language/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/font/Roboto-Light.ttf
          weight: 300
        - asset: assets/font/Roboto-Regular.ttf
          weight: 400
        - asset: assets/font/Roboto-Medium.ttf
          weight: 500
        - asset: assets/font/Roboto-Bold.ttf
          weight: 700

    - family: Norsal
      fonts:
        - asset: assets/font/Norsal-ExtraLight.otf
          weight: 200
        - asset: assets/font/Norsal-Regular.otf
          weight: 400
        - asset: assets/font/Norsal-SemiBold.otf
          weight: 600
        - asset: assets/font/Norsal-Bold.otf
          weight: 700
    - family: SaudiRiyal
      fonts:
        - asset: assets/font/SaudiRiyal-Regular.otf
