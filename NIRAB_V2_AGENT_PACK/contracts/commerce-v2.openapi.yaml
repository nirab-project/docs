      properties:
        contract_version:
          type: integer
          enum:
            - 2
        minimum_contract:
          type: integer
          minimum: 2
        generation:
          type: string
        modes:
          type: array
          items:
            type: string
        external_live_enabled:
          type: boolean
        currency:
          type: string
        currency_exponent:
          type: integer
          minimum: 0
        timezone:
          type: string
        terms_version:
          type: string
        commerce_v2_enabled:
          type: boolean
        payment_methods:
          type: array
