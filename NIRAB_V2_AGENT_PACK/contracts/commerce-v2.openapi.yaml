openapi: 3.0.3
info:
  title: 'NIRAB Commerce V2 — proposed implementation contract'
  version: 2.0-code-only
  description: |-
    عقد مطلوب تنفيذه. لا endpoints مؤكدة الآن. dynamic form/pricing definitions تخضع أيضاً لـJSON Schema والتحقق الدلالي؛ مصدر الأسعار هو الخادم.
    Implementation contracts for PH-00..PH-11. Runtime validation has not run; PH-12 is excluded by the user.
servers:
  -
    url: 'http://127.0.0.1:8080/api/v2/commerce'
    description: 'Local validation only; owner configures production separately.'
security:
  -
    BearerAuth: []
paths:
  /capabilities:
    get:
      operationId: get_capabilities
      summary: 'عقد القدرات والجيل الحالي'
      tags:
        - Configuration
      parameters:
        -
          name: X-Commerce-Contract
          in: header
          required: true
          schema:
            type: integer
            enum:
              - 2
      security: []
      responses:
        200:
          description: 'Result; not proof of payment unless explicit verified state.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Capabilities'
                  meta:
                    $ref: '#/components/schemas/Meta'
                required:
                  - data
                  - meta
                additionalProperties: false
        default:
          description: 'Typed error; no private internal data.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /guest-sessions:
    post:
      operationId: post_guest_sessions
      summary: 'جلسة ضيف محدودة لا تثبت هوية هاتف'
      tags:
        - Identity
      parameters:
